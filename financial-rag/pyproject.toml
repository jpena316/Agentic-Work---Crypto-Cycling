[project]
name = "financial-rag"
version = "0.1.0"
description = "Financial document RAG pipeline with MCP server — 10-K, 10-Q, and earnings transcript ingestion, chunking, embedding, and retrieval via Pinecone"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "pinecone>=5.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "tiktoken>=0.8.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_rag"]

[tool.hatch.build.targets.editable]
packages = ["src/financial_rag"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
